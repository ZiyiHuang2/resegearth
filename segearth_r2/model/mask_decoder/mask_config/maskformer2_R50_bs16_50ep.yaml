_BASE_: Base-COCO-InstanceSegmentation.yaml
MODEL:
  META_ARCHITECTURE: "MaskFormer"
  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 80
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    # pixel decoder
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "MultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    SEG_NORM: False
    SEG_PROJ: True
    WITH_SEG: False
    WITH_REGION: True
    LN_2048: False
    SEG_TASK: 'instance'
    SEG_IDX_BACK: False
    FUSE_SCORE: False
    MATCHER_TYPE: 'w_class'
    LLM_POS: 'none'
    CRITERION_TYPE: 'wo_concat'
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 10  # 9 decoder layers, add one for the loss on learnable query
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.8

CS_DEG:
  ENABLED: false

  # ablations
  RET: true
  DEPG: true
  BHEF: true
  SOFT_BIAS: true
  MASK_HEAD: true
  HCML_LOSS: true
  EVIDENCE_CONSISTENCY: true
  BOUNDARY_LOSS: false

  # architecture
  HIDDEN_DIM: 256
  EVIDENCE_DIM: 64
  PROMPT_TOKEN_NUM: 4
  NUM_HEADS: 8
  EVIDENCE_START_LAYER: 1
  USE_MASK_FEATURE_DETAIL: true
  USE_UNCERTAINTY: true

  # attention bias
  BIAS_MAX: 5.0
  BIAS_WARMUP_STEPS: 1000
  CONTEXT_LAMBDA: 1.0

  # gates
  RET_GATE_INIT: 0.0
  BHEF_GATE_INIT: 0.0
  BIAS_ALPHA_INIT: 0.0
  MASK_GAMMA_INIT: 0.0
  MASK_ETA_INIT: 0.0

  # HCML loss
  LOSS_CONTEXT_WEIGHT: 2.0
  LOSS_EVIDENCE_WEIGHT: 1.0
  LOSS_RANK_WEIGHT: 0.5
  LOSS_SIBLING_AUX_WEIGHT: 0.1
  LOSS_CONSISTENCY_WEIGHT: 0.5
  LOSS_BOUNDARY_WEIGHT: 0.2
  HCML_WARMUP_STEPS: 1000
  HCML_RAMP_STEPS: 500
  HARD_TOPK_RATIO: 0.01
  HARD_TOPK_MIN: 100
  RANK_MARGIN: 0.2

  # logging
  LOG_GRAD_NORM: true
  LOG_ATTENTION_STATS: false
